name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (caches ~/.gradle)
        uses: gradle/actions/setup-gradle@v4

      # Debug builds are signed with ~/.android/debug.keystore, which a fresh runner would regenerate on
      # every run. Android refuses to update an app over an APK signed with a different key, so keep the
      # same debug key between runs. It is a throwaway debug key (not a release key) and never enters git.
      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Install dependencies
        run: |
          if ! pnpm install --frozen-lockfile; then
            echo "::warning::pnpm-lock.yaml is out of sync with package.json; resolving it fresh (it is committed back below)"
            pnpm install --no-frozen-lockfile
          fi

      # Build first: `next build` writes next-env.d.ts and .next/types, which tsc needs.
      - name: Build static web app (out/)
        run: pnpm build

      - name: Verify static routes
        run: |
          for page in index.html foods/index.html progress/index.html settings/index.html manifest.webmanifest sw.js; do
            test -f "out/$page" || { echo "::error::out/$page is missing from the static export"; exit 1; }
          done

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi

      - name: Apply Mizano launcher icons
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 scripts/android-icons.py

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify and name the APK
        id: apk
        run: |
          src=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          unzip -l "$src" | grep -q 'assets/public/index.html' || { echo "::error::APK does not contain the web app"; exit 1; }
          unzip -p "$src" assets/capacitor.config.json | grep -q 'com.omgh32456uwq.mizano' || { echo "::error::APK has the wrong app id"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            name="mizano-${GITHUB_REF_NAME}-debug.apk"
          else
            name="mizano-debug-${GITHUB_SHA::7}.apk"
          fi
          mkdir -p dist
          cp "$src" "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "### $name ($(du -h "dist/$name" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mizano-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Keeps the repo complete: the generated android/ project and the resolved lockfile land on the branch
      # that was dispatched. Best effort, so a protected branch only costs a warning, never the APK.
      - name: Commit generated Android project and lockfile
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml android
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore(android): commit generated Android project and resolved lockfile"
          git push

  release:
    name: Attach APK to GitHub Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: mizano-debug-apk
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
