name: Onboarding Android Visual QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onboarding-android-qa-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-emulator:
    name: Build, install and capture Android onboarding
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare screenshot folder
        run: mkdir -p artifacts/onboarding

      - name: Run app on Android Emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eux
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"
            adb shell wm size 412x915
            adb shell wm density 420
            adb install -r "$APK"
            adb shell pm clear com.omgh32456uwq.mizano
            adb shell monkey -p com.omgh32456uwq.mizano 1
            sleep 2
            adb exec-out screencap -p > artifacts/onboarding/01-opening-growth.png
            sleep 1
            adb exec-out screencap -p > artifacts/onboarding/02-logo-card-morph.png
            sleep 2
            adb exec-out screencap -p > artifacts/onboarding/03-welcome-light-en.png

            # Advance by the visible Continue control; coordinates are a fallback if WebView accessibility omits it.
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/window.xml > artifacts/onboarding/03-welcome-ui.xml || true
            python3 - <<'PY'
            import re, subprocess, xml.etree.ElementTree as ET
            def tap_text(needle, fallback_x, fallback_y):
                subprocess.run(["adb", "shell", "uiautomator", "dump", "/sdcard/window.xml"], capture_output=True)
                try:
                    raw = subprocess.check_output(["adb", "shell", "cat", "/sdcard/window.xml"], text=True)
                    root = ET.fromstring(raw)
                    for node in root.iter("node"):
                        if needle.casefold() in node.attrib.get("text", "").casefold():
                            m = re.search(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.attrib.get("bounds", ""))
                            if m:
                                x1,y1,x2,y2 = map(int,m.groups())
                                subprocess.run(["adb","shell","input","tap",str((x1+x2)//2),str((y1+y2)//2)],check=True)
                                return
                except Exception:
                    pass
                subprocess.run(["adb","shell","input","tap",str(fallback_x),str(fallback_y)],check=True)
            tap_text("Continue", 206, 650)
            PY
            sleep 3
            adb exec-out screencap -p > artifacts/onboarding/03-about.png

            # Exercise the adult path and capture the profile wheels + visual choices.
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/window.xml > artifacts/onboarding/03-about-ui.xml || true
            python3 - <<'PY'
            import re, subprocess, xml.etree.ElementTree as ET
            def tap_text(needle, fallback_x, fallback_y):
                subprocess.run(["adb", "shell", "uiautomator", "dump", "/sdcard/window.xml"], capture_output=True)
                try:
                    raw = subprocess.check_output(["adb", "shell", "cat", "/sdcard/window.xml"], text=True)
                    root = ET.fromstring(raw)
                    for node in root.iter("node"):
                        if needle.casefold() in node.attrib.get("text", "").casefold():
                            m = re.search(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.attrib.get("bounds", ""))
                            if m:
                                x1,y1,x2,y2 = map(int,m.groups())
                                subprocess.run(["adb","shell","input","tap",str((x1+x2)//2),str((y1+y2)//2)],check=True)
                                return
                except Exception:
                    pass
                subprocess.run(["adb","shell","input","tap",str(fallback_x),str(fallback_y)],check=True)
            tap_text("18 or older", 206, 335)
            tap_text("Continue", 206, 700)
            PY
            sleep 3
            adb exec-out screencap -p > artifacts/onboarding/04-adult-profile.png

            # Reset app data to exercise the privacy-safe under-18 path independently.
            adb shell pm clear com.omgh32456uwq.mizano
            adb shell monkey -p com.omgh32456uwq.mizano 1
            sleep 2
            adb shell input tap 206 450
            sleep 2
            python3 - <<'PY'
            import re, subprocess, xml.etree.ElementTree as ET
            def tap_text(needle, fallback_x, fallback_y):
                subprocess.run(["adb", "shell", "uiautomator", "dump", "/sdcard/window.xml"], capture_output=True)
                try:
                    raw = subprocess.check_output(["adb", "shell", "cat", "/sdcard/window.xml"], text=True)
                    root = ET.fromstring(raw)
                    for node in root.iter("node"):
                        if needle.casefold() in node.attrib.get("text", "").casefold():
                            m = re.search(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.attrib.get("bounds", ""))
                            if m:
                                x1,y1,x2,y2 = map(int,m.groups())
                                subprocess.run(["adb","shell","input","tap",str((x1+x2)//2),str((y1+y2)//2)],check=True)
                                return
                except Exception:
                    pass
                subprocess.run(["adb","shell","input","tap",str(fallback_x),str(fallback_y)],check=True)
            tap_text("Continue", 206, 650)
            tap_text("Under 18", 206, 390)
            tap_text("Continue", 206, 700)
            PY
            sleep 3
            adb exec-out screencap -p > artifacts/onboarding/05-under18-ready.png
            adb shell dumpsys activity activities > artifacts/onboarding/activity.txt
            adb shell logcat -d -t 2500 > artifacts/onboarding/logcat.txt

      - name: Upload Android screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mizano-onboarding-android-visual-qa
          path: artifacts/onboarding/
          if-no-files-found: warn
          retention-days: 14
